<style>
/* Layout: ورقة كشكول واحدة في النص، هامش أحمر، شريط أقسام ثابت فوق */
:root{
  --bg:#e6ebf3; --paper:#fbfcfe; --card:#ffffff; --card-edge:#cbd6e8;
  --ink:#0c1f3f; --ink-2:#44577a; --line:#dbe3f0;
  --gold:#c9a13b; --gold-ink:#7d5f0c; --gold-wash:#faf2d8; --hl:rgba(201,161,59,.38);
  --margin:#d4584c; --rule:#d9e2f0;
  --cat-a:#a23d35; --cat-a-wash:#fbebe9;
  --cat-b:#1f4f9a; --cat-b-wash:#e6eefb;
  --cat-c:#7d5f0c; --cat-c-wash:#faf2d8;
  --ok:#1d7a4d; --no:#b3382e; --ok-wash:#e4f4ec; --no-wash:#fbebe9;
  --head-bg:#0c1f3f; --head-ink:#f3f6fc;
  --shadow:0 1px 0 rgba(12,31,63,.06),0 10px 28px rgba(12,31,63,.10);
  --f-display:'Aref Ruqaa','Amiri',serif;
  --f-body:'Tajawal','Cairo',system-ui,sans-serif;
  --f-ui:'Cairo','Tajawal',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07142b; --paper:#0c1f3f; --card:#132a52; --card-edge:#2a4577;
    --ink:#eaf0fb; --ink-2:#a9b8d3; --line:rgba(255,255,255,.07);
    --gold-ink:#e2bf62; --gold-wash:rgba(201,161,59,.14); --hl:rgba(201,161,59,.35);
    --margin:#e5675c; --rule:rgba(143,184,244,.12);
    --cat-a:#f19189; --cat-a-wash:rgba(241,145,137,.13);
    --cat-b:#8fb8f4; --cat-b-wash:rgba(143,184,244,.13);
    --cat-c:#e2bf62; --cat-c-wash:rgba(201,161,59,.14);
    --ok:#6fd3a0; --no:#f19189; --ok-wash:rgba(111,211,160,.14); --no-wash:rgba(241,145,137,.14);
    --head-bg:#c9a13b; --head-ink:#0c1f3f; --shadow:0 10px 28px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07142b; --paper:#0c1f3f; --card:#132a52; --card-edge:#2a4577;
  --ink:#eaf0fb; --ink-2:#a9b8d3; --line:rgba(255,255,255,.07);
  --gold-ink:#e2bf62; --gold-wash:rgba(201,161,59,.14); --hl:rgba(201,161,59,.35);
  --margin:#e5675c; --rule:rgba(143,184,244,.12);
  --cat-a:#f19189; --cat-a-wash:rgba(241,145,137,.13);
  --cat-b:#8fb8f4; --cat-b-wash:rgba(143,184,244,.13);
  --cat-c:#e2bf62; --cat-c-wash:rgba(201,161,59,.14);
  --ok:#6fd3a0; --no:#f19189; --ok-wash:rgba(111,211,160,.14); --no-wash:rgba(241,145,137,.14);
  --head-bg:#c9a13b; --head-ink:#0c1f3f; --shadow:0 10px 28px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.95;margin:0;
  padding-block:0 72px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
bdi.en,.ltr{font-family:var(--f-ui);unicode-bidi:isolate}
.ltr{direction:ltr;text-align:left}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}

/* شريط الأقسام */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;gap:10px;align-items:center;padding-block:8px;border-bottom:1px solid var(--card-edge)}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding-block:2px;
  -webkit-mask-image:linear-gradient(to left,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to left,#000 calc(100% - 24px),transparent);padding-inline-end:20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--f-ui);font-size:13.5px;font-weight:600;line-height:1.4;padding:6px 13px;border-radius:999px;border:1px solid var(--card-edge);background:var(--card);color:var(--ink-2);text-decoration:none;white-space:nowrap}
.chip:hover,.chip.on{background:var(--head-bg);border-color:var(--head-bg);color:var(--head-ink)}
.themeb{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--card-edge);background:var(--card);color:var(--gold-ink);cursor:pointer;padding:0}
.themeb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.themeb .i-moon{display:none}
.themeb.dark .i-sun{display:none}
.themeb.dark .i-moon{display:block;fill:currentColor}

/* الورقة */
/* ورق مسطّر: سطر كل 34px تحت الكلام، والجداول والكروت ليها خلفيتها فوق السطور */
.sheet{position:relative;width:100%;background-color:var(--paper);
  background-image:linear-gradient(to bottom,transparent 33px,var(--rule) 33px);background-size:100% 34px;background-position:0 20px;
  border-radius:6px;box-shadow:var(--shadow);padding-block:28px 40px;padding-inline-start:44px;padding-inline-end:28px;
  display:flex;flex-direction:column;gap:44px;min-width:0}
.sheet::before{content:"";position:absolute;inset-block:0;inset-inline-start:30px;width:0;border-inline-start:1.5px solid var(--margin);opacity:.55;pointer-events:none}
.sheet::after{content:"";position:absolute;inset-block:0;inset-inline-start:9px;width:10px;pointer-events:none;
  background:radial-gradient(circle at center,var(--bg) 0 3.5px,transparent 4px) center 36px/10px 96px repeat-y}
.sheet>*{min-width:0}
.sheet{overflow-wrap:anywhere}
mark{background:none;color:inherit;box-shadow:inset 0 -.5em 0 var(--hl);padding-inline:1px}

              {main:"{{r26|ش 6، 10}}", ex:"", cat:"c"}]},
      {head:"الأدوات: الأحداث", sub:"Incidents",
       cells:[{main:"الأدوات **4**: **Incidents Reporting**، **RCSA**، **KRIs**، **ORAP** (Other Risk Approval Process). **الحدث** = خلل في العمليات أو السلوك البشري أو النظم أو عوامل خارجية، وأثره مالي أو غير مالي (سمعة، تكلفة فرصة بديلة).", ex:"يتبلغ عن: أي حدث سبب خسارة **حتى لو اتسددت**، **زيادة** في النقدية أو الإيرادات بالغلط، تعطيل الأعمال، ما يمس السمعة، أحداث التكنولوجيا، والأحداث الخارجية.", cat:"a"},
              {main:"الإبلاغ **مسئولية كل العاملين**، والفروع تبلّغ **الإدارة المركزية لمخاطر التشغيل** بالتنسيق مع **Risk Champion**، و**فور الاكتشاف**. **5 Whys**: تسأل 'ليه' كذا مرة لحد السبب الجذري.", ex:"مثال: حساب اتفتح ببطاقة منتهية ← الموظف مالاحظش ← ماراجعش ← دخّل تاريخ مختلف يعدّي المنع ← المشرف ماطابقش. **الجذر**: ضعف الوعي بالمخاطر واعتبار التعليمات روتين.", cat:"b"},
              {main:"{{r26|ش 7 لـ 9}}", ex:"", cat:"c"}]},
      {head:"الأدوات: RCSA وKRIs", sub:"",
       cells:[{main:"**RCSA** (تقييم ذاتي) للنشاط **القائم**: المخاطر بافتراض مفيش ضوابط، الضوابط الحالية (آلية/يدوية) واختبارها، المتبقية، وضوابط مقترحة للمتبقي **High / Medium High**. التحديث **كل سنتين على الأقل** أو عند: دليل جديد، أحداث متكررة، احتيال، ملاحظات رقابية متكررة، تغيير جوهري، نظام جديد.", ex:"**Risk Champion** يحدد ويقيّم ويختبر الضوابط وينفذ المقترح، والإدارة المركزية تراجع.", cat:"a"},
              {main:"**KRIs** = مقاييس **تنبؤية** (إنذار مبكر) **قابلة للقياس** ليها حدود إنذار وتصعيد، تتقاس شهري أو ربع أو نص سنوي أو سنوي، وتتراجع **سنويًا على الأقل**. **أخضر**: ضمن Appetite. **أصفر Amber**: يساوي Appetite وضمن **Tolerance** ← مراقبة وخطط تصحيح. **أحمر Breach**: إجراءات سريعة وخطة فورية و**تصعيد**.", ex:"**Appetite** = اللي البنك راضي بيه، **Tolerance** = أقصى سماح.", cat:"b"},
              {main:"{{r26|ش 10 لـ 12}}", ex:"", cat:"c"}]},
      {head:"ORAP وخطة العمل", sub:"الجديد والفجوات",
       cells:[{main:"**ORAP** = تقييم المخاطر المتأصلة في **المنتجات والخدمات الجديدة قبل البدء**. صاحب الأعمال ينسق، **مدير المشروع** يجمع المستندات ويحدد المخاطر وخطة التخفيف ويستوفي الاعتماد، ومندوبو الإدارات يحطوا الضوابط **قبل التنفيذ**.", ex:"**قائم ← RCSA**، **جديد ← ORAP**. وبيتطبق كمان على المشروعات التقنية والموردين قبل التعاقد.", cat:"a"},
              {main:"**Action Plan**: إجراءات **تصحيحية** (السبب الحالي) و**وقائية** (منع التكرار)، من كل الأدوات، واضحة وبتاريخ مستهدف واقعي. **Action Owner** هو المسئول الأول حتى لو التنفيذ مع أطراف تانية.", ex:"", cat:"b"},
              {main:"{{r26|ش 13، 14}}", ex:"", cat:"c"}]},
      {head:"السياسات", sub:"الخسائر والتصعيد والقبول",
       cells:[{main:"**الخسائر**: الوحدة تنسق الموافقات حسب **جدول الصلاحيات المالية**، والعرض على **القطاع المالي في كل الحالات** والقانونية عند الحاجة، وإخطار إدارة مخاطر التشغيل (وبقيمة **المخصص** للمحتملة). **التصعيد**: مفيش رد خلال **5 أيام عمل** ← المدير المباشر ← (5 أيام من آخر تاريخ مستهدف) المدير العام ← رئيس القطاع ← **اللجان العليا** للعالية.", ex:"التصعيد = نقل المسئولية للأعلى عشان الخطر مايفضلش من غير صاحب قرار.", cat:"a"},
              {main:"**قبول الخطر** (بدل التجنب أو النقل أو التخفيف) لما تكلفة التخفيف أعلى من الأثر: متبقي **متوسط مرتفع** ← **المدير العام** للإدارة بنموذج قبول الخطر مع **إحاطة رئيس القطاع**. **مرتفع** ← **اللجنة التنفيذية**.", ex:"كل ما الخطر يعلى، اللي يقبله يعلى.", cat:"b"},
              {main:"{{r26|ش 15 لـ 17}}", ex:"", cat:"c"}]},
      {head:"الأطراف الخارجية وGRC", sub:"",
       cells:[{main:"مخاطر **الطرف الخارجي** من تعهيد أو مزود خدمة (موردين، مقدمي خدمات، شركاء، مؤسسات مالية). **5 مراحل**: تأهيل أولي ← تحديد المخاطر والعناية الواجبة (فيها **اتفاقية الخروج**) ← التعاقد ← المراقبة المستمرة ← إنهاء التعاقد / **خطة الخروج**.", ex:"", cat:"a"},
              {main:"**GRC** بيربط الأدوات في قاعدة واحدة **Risk Register**: إنذار مبكر، تصعيد آلي لو الخطر مااتعالجش، تقارير فورية وDashboards، ورقابة ذاتية بمشاركة Risk Champion.", ex:"", cat:"b"},
              {main:"{{r26|ش 18 لـ 20}}", ex:"", cat:"c"}]},
      {head:"استمرارية الأعمال والأزمات", sub:"BCM",
       cells:[{main:"**الاستمرارية** = تقديم الخدمات الأساسية **أثناء وبعد** الأزمة، و**إدارة الأزمات** = القرارات للتعامل مع المفاجئ. أهم مخاطر 2026: **تعطل الأنظمة، الكهرباء، الاتصالات، الموردين** (مثال: حريق سنترال رمسيس). **Incident** محدود يتحتوى، **Crisis** كبيرة محتاجة تدخل إداري موسع.", ex:"البدائل: العمل من البيت، موقع بديل، التشغيل اليدوي المؤقت، نقل الشغل لفرع تاني. والدروس: خطط محدثة، تصعيد سريع، بدائل جاهزة، تنسيق، واختبار دوري.", cat:"a"},
              {main:"**دورك**: قبل (التزم، **حدّث بيانات اتصالك**، اعرف خطط إدارتك)، أثناء (بلّغ بسرعة، التزم بالتعليمات، **السرية**، تعاون)، بعد (ساعد في الاستعادة والتقييم). البلاغ **بالإيميل للفريق المختص** مع إخطار **BCMTeam@banquemisr.com**، و**ممنوع**: نشر معلومات مش مؤكدة، **قرارات فردية**، تأخير البلاغ.", ex:"المادة السابقة: مسئوليات BCM (الوعي، **BIA**، الخطط، المقرات البديلة)، الإقرار عن الأحداث **ربع سنوي** في أول **10 أيام عمل** (ومايغنيش عن البلاغ)، وتقرير ربع سنوي للجنة **BRCC**.", cat:"b"},
              {main:"{{r26|ش 22 لـ 28}}", ex:"{{rold|المادة السابقة}}", cat:"c"}]},
      {head:"مخاطر التكنولوجيا", sub:"TRM",
       cells:[{main:"التحول الرقمي بيزود الكفاءة **وبيزود** التعرض لمخاطر التكنولوجيا والأمن السيبراني. الإطار: تقييم ← معالجة (حماية **السرية والسلامة والتوافر**) ← مراقبة وتقارير للإدارة العليا.", ex:"", cat:"a"},
              {main:"تتابع متطلبات **الاختبار** (سيناريو، UAT، طلبات التغيير)، وتدير أحداث التكنولوجيا وأسبابها و**CAPA** (Corrective And Preventive Action)، وتطبق **ORAP** على المشروعات التقنية والموردين، وKRIs وRCSA مع قطاعات التكنولوجيا.", ex:"CAPA = تصحيحي + وقائي، نفس فكرة الـ Action Plan.", cat:"b"},
              {main:"{{r26|ش 29 لـ 33}}", ex:"", cat:"c"}]}
    ],
    legend:"الأحمر = الفكرة · الأزرق = إمتى والتفاصيل · الذهبي = المصدر (دوس عليه يفتح الملف على الدرايف).",
    goldenRule:"اسأل: ده **حدث** (بلّغ فورًا حتى لو اتسوى) ولا **قياس** (KRI إنذار مبكر) ولا **تقييم قائم** (RCSA كل سنتين) ولا **منتج جديد** (ORAP قبل البدء)؟ و**5 أيام عمل** للتصعيد، و**المتوسط المرتفع للمدير العام والمرتفع للتنفيذية**."
  },
  sections:[
    {type:"concepts", id:"concepts", title:"المفاهيم والخسائر", items:[
      {nameEn:"Operational Risk", nameAr:"تعريف مخاطر التشغيل", cat:"a",
       formula:[{sign:"+",text:"مخاطر الخسارة الناتجة عن **عدم كفاية أو فشل**: **الإجراءات** (خلل في الرقابة الداخلية) أو **الأشخاص** (إخفاق العاملين) أو **الأنظمة** (تعطلها) أو **الأحداث الخارجية**"},
                {sign:"+",text:"يتضمن **عمليات التزوير والغش**، و**المخاطر القانونية**"},
                {sign:"-",text:"يستثني **المخاطر الاستراتيجية** و**مخاطر السمعة**"},
                {sign:"+",text:"تنظيم إدارتها: آلية **الإبلاغ** ودراسة الأحداث، مراجعة إجراءات العمل، تقييم مخاطر **المنتجات والخدمات الجديدة**، وتحديد **الضوابط الرقابية**"}],
       uses:["أساس كل الأسئلة"],
       examples:[{en:"صراف قبل ورقة مزورة",ar:"**إجراءات / أشخاص**"},
                 {en:"السيستم وقع والفرع وقف",ar:"**أنظمة**"},
                 {en:"حريق أو انقطاع كهرباء عام",ar:"**أحداث خارجية**"}],
       signals:["4 مصادر","يشمل القانونية","يستثني الاستراتيجية والسمعة","التزوير والغش"],
       tip:"القانونية **جوه** التعريف لأن الغرامات غالبًا بتيجي من خلل في الإجراءات. أما الاستراتيجية والسمعة فمرتبطين بقرارات الإدارة ورأي الناس.",
       src:"{{r26|ش 2}}"},
      {nameEn:"Risk Types", nameAr:"أنواع المخاطر المصرفية", cat:"a",
       formula:[{sign:"+",text:"**الائتمان**: تعثر العميل · **السوق**: تحركات الفائدة والصرف والأوراق المالية · **السيولة**: عدم توفير التمويل في الوقت المناسب"},
                {sign:"+",text:"**الاستراتيجية**: قرارات خاطئة أو متأخرة أو **تحول معاكس في التوقعات والأهداف**"},
                {sign:"+",text:"**السمعة**: آراء عامة سلبية · **القانونية**: غرامات وعقوبات · **التشغيل**: القاسم المشترك"},
                {sign:"+",text:"معدل كفاية رأس المال = **القاعدة الرأسمالية ÷ (الائتمان + السوق + التشغيل)**"}],
       uses:["أسئلة 'اختار نوع الخطر'"],
       examples:[{en:"التحول المعاكس في التوقعات",ar:"**استراتيجية**"},{en:"لا تخلو منها أي إدارة",ar:"**التشغيل** (القاسم المشترك)"}],
       signals:["تعثر","أسعار","تمويل","تحول معاكس","القاسم المشترك"],
       tip:"ده من المادة السابقة ومش متكرر في 2026، بس لسه بيتسأل.",
       src:"{{rold|المادة السابقة}}"},
      {nameEn:"Framework & Role", nameAr:"إطار العمل ودور إدارة مخاطر التشغيل", cat:"a",
       formula:[{sign:"+",text:"إطار العمل 5 خطوات: **A تحديد** ← **B تقييم** ← **C قياس** ← **D الحد من المخاطر** ← **E المراقبة**"},
                {sign:"+",text:"دور الإدارة: **وضع السياسات** وموافقة **مجلس الإدارة** عليها، ووضع الإجراءات والأدوات"},
                {sign:"+",text:"**التنسيق** لوضع الضوابط لتخفيض المخاطر **للحد المقبول**"},
                {sign:"+",text:"**مساعدة** وحدات الأعمال بالتدريب والتواصل، و**متابعة** تنفيذ التوصيات"},
                {sign:"+",text:"عرض **التقارير الدورية** على اللجان المختلفة"}],
       uses:["ترتيب الخطوات"],
       examples:[{en:"أول خطوة",ar:"**التحديد**: ما ينفعش تقيس خطر لسه ما عرفتهوش"}],
       signals:["Identification","Assessment","Measurement","Mitigation","Monitoring"],
       tip:"الترتيب منطقي: **اعرفه ← قيّمه ← قيسه ← قلّله ← تابعه**.",
       src:"{{r26|ش 3 لـ 4}}"},
      {nameEn:"Four Lines of Defense", nameAr:"خطوط الدفاع الأربعة", cat:"a",
       formula:[{sign:"+",text:"**الأول: وحدات الأعمال** (والفرع منها): تحدد المخاطر وتقيّمها وتنفذ **الضوابط والإجراءات التصحيحية**"},
                {sign:"+",text:"**التاني: القطاعات الرقابية** (المخاطر، الالتزام والحوكمة المؤسسية، الرقابة الداخلية): تدعم وحدات الأعمال، **تحدد الصلاحيات**، وتتأكد من الالتزام بالأنظمة والقوانين وميثاق العمل"},
                {sign:"+",text:"**التالت: المراجعة الداخلية**: تتأكد إن الخط الأول والتاني بيقوموا بدورهم"},
                {sign:"+",text:"**الرابع: المراجعين الخارجيين، الجهات الرقابية الخارجية، الشركات الاستشارية**: تقييم فعالية أنظمة إدارة المخاطر ودقة التقارير المالية وكفاءة الضوابط"}],
       uses:["أسئلة الأدوار"],
       examples:[{en:"البنك المركزي بيفتش",ar:"**الخط الرابع**"},{en:"قطاع الالتزام",ar:"**الخط التاني**"},{en:"الفرع",ar:"**الخط الأول**"}],
       signals:["4 خطوط","الخارجيين = الرابع","المراجعة الداخلية = التالت"],
       tip:"كل ما تبعد عن العملية اليومية تعلى في الرقم: اللي بيشتغل ← اللي بيراقب ← اللي بيراجع جوه ← اللي بيراجع من برّه.",
       src:"{{r26|ش 5}}"},
      {nameEn:"Loss Types", nameAr:"أنواع الخسائر التشغيلية (6)", cat:"a",
       formula:[{sign:"+",text:"**فعلية نهائية**: تحملها البنك و**اتثبتت في حساباته**"},
                {sign:"+",text:"**فعلية مؤقتة**: أثرها المالي مؤكد، بتتسجل في **حسابات مؤقتة** لحد تحديد **المتسبب**، وبعدها تتثبت في **مصروفات خسائر أحداث تشغيلية**"},
                {sign:"+",text:"**محتملة**: ممكن البنك يتحملها بسبب **نزاع مع العميل** (شكوى أو دعوى)، ويتكوّن **مخصص** بقيمتها بعد التأكد من صحتها"},
                {sign:"+",text:"**غير محققة**: احتمالها انتفى لأن **ضابط رقابي** اكتشف الحدث قبل الخسارة (نقدية مزورة قبل الإيداع، شيك مزور قبل الصرف)"},
                {sign:"+",text:"**خطأ أدى إلى مكسب**: مبالغ **اتضافت لحسابات البنك** بسبب خطأ من الأفراد أو الأنظمة أو الإجراءات أو أحداث خارجية"},
                {sign:"+",text:"**مالية غير مباشرة**: **غير ملموسة** وصعب تحديد قيمتها: **السمعة / الالتزام / الميديا / الموظفين**"},
                {sign:"?",text:"الخسارة الفعلية بتتسجل **بإجماليها قبل خصم المسترد** (اختلاس اتسدد جزء منه يتسجل كله)"}],
       uses:["تصنيف أي حدث"],
       examples:[{en:"عجز في الخزينة ولسه بيدوّروا مين السبب",ar:"**فعلية مؤقتة**"},
                 {en:"عميل رفع قضية",ar:"**محتملة**"},
                 {en:"عمولة اتحصلت زيادة بالغلط لصالح البنك",ar:"**خطأ أدى إلى مكسب**"},
                 {en:"خبر سلبي عن البنك في السوشيال ميديا",ar:"**مالية غير مباشرة**"}],
       signals:["اتثبتت","حسابات مؤقتة","نزاع ومخصص","ضابط اكتشف","اتضافت للبنك","غير ملموسة"],
       tip:"حتى **المكسب** بالغلط حدث تشغيلي لازم يتبلغ: الخلل اللي ضيف فلوس للبنك ممكن يخصم بكرة.",
       src:"{{r26|ش 6}}"},
      {nameEn:"Inherent & Residual", nameAr:"المتأصلة، الضوابط، المتبقية", cat:"a",
       formula:[{sign:"+",text:"**المتأصلة**: مرتبطة **بطبيعة النشاط**، وبتتقيّم **بافتراض عدم وجود ضوابط**"},
                {sign:"+",text:"**الضابط الرقابي**: يقلل **التكرار والأثر** ويوصل الخطر **للحد المقبول**، لكنه **ما بيمنعهوش**"},
                {sign:"+",text:"معايير الضابط: **قابل للتطبيق**، **التكلفة والعائد**، **واضح**، **سهل المتابعة**"},
                {sign:"+",text:"**المتبقية**: اللي بيفضل **بعد** تطبيق الضوابط الحالية"},
                {sign:"+",text:"مصفوفة المخاطر المعتمدة: **High · Medium High · Medium Low · Low**"}],
       uses:["التفرقة بين قبل وبعد الضوابط"],
       examples:[{en:"خزينة الفرع",ar:"المتأصل: مزور وعجز وسطو. الضوابط: كاميرات وتصريح قبل التنفيذ وأجهزة كشف"}],
       signals:["طبيعة النشاط","بافتراض عدم وجود ضوابط","بعد الضوابط"],
       tip:"**متأصلة = قبل** الضوابط · **متبقية = بعد** الضوابط.",
       src:"{{r26|ش 10}} · {{rold|المادة السابقة}}"}
    ]},
    {type:"concepts", id:"tools", title:"الأدوات والسياسات", items:[
      {nameEn:"Operational Risk Tools", nameAr:"أدوات مخاطر التشغيل (4)", cat:"b",
       formula:[{sign:"+",text:"**1. إدارة الأحداث التشغيلية** Incidents Reporting"},
                {sign:"+",text:"**2. التقييم الذاتي للمخاطر والضوابط** RCSA (Risks & Controls Self Assessment)"},
                {sign:"+",text:"**3. مؤشرات الخطر الرئيسية** KRIs (Key Risk Indicators)"},
                {sign:"+",text:"**4. أداة دعم اتخاذ القرار لاعتماد المشروعات الجديدة** ORAP (Other Risk Approval Process)"}],
       uses:["أسماء الأدوات"],
       examples:[{en:"منتج جديد هينزل",ar:"**ORAP**"},{en:"مراجعة مخاطر نشاط قائم",ar:"**RCSA**"}],
       signals:["Incidents","RCSA","KRIs","ORAP"],
       tip:"الاسم الإنجليزي لـORAP في 2026 = **Other Risk Approval Process**.",
       src:"{{r26|ش 7}}"},
      {nameEn:"Incidents Reporting", nameAr:"إدارة الأحداث التشغيلية والإبلاغ", cat:"b",
       formula:[{sign:"+",text:"**الحدث**: خلل أو قصور في العمليات الداخلية أو السلوك البشري أو النظم والبرامج أو العوامل الخارجية"},
                {sign:"+",text:"**الأثر**: خسائر **مالية أو غير مالية** (السمعة أو **تكلفة الفرصة البديلة**)"},

   {id:"q10",section:"s1",prompt:"عميل رفع شكوى ونزاع مع البنك، والبنك كوّن مخصص بقيمتها بعد التأكد من صحتها:",answer:"خسارة محتملة",clue:"نزاع ومخصص.",
    why:"البنك ممكن يتحمل الخسارة حسب نتيجة النزاع، فمش مؤكدة ولا نهائية. عشان كده بيتجنب مخصص بقيمتها لحد ما الموضوع يتحسم.",
    wrong:[{option:"خسارة فعلية نهائية",why:"لسه ما اتحملهاش."},{option:"خسارة غير محققة",why:"مفيش ضابط منعها، النزاع قائم."},{option:"مالية غير مباشرة",why:"ليها قيمة مالية محددة."}]},
   {id:"q11",section:"s1",prompt:"موظف اختلس مبلغًا وسدد جزءًا منه. مبلغ الخسارة المسجل:",answer:"قيمة المبلغ المختلس بالكامل",clue:"قبل خصم المسترد.",
    why:"الخسارة بتتسجل بحجم الحدث كله قبل خصم المسترد، عشان قاعدة البيانات تعكس حجم الخطر الحقيقي. المسترد بيتابَع لوحده.",
    wrong:[{option:"المبلغ غير المسترد",why:"بيقلل حجم الحدث ويخفي خطورته."},{option:"لا توجد خسارة",why:"الاختلاس حصل فعلًا."},{option:"المبلغ المسدد فقط",why:"ده عكس المنطق."}]},
   {id:"q12",section:"s2",prompt:"أدوات مخاطر التشغيل الأربعة هي:",answer:"إدارة الأحداث، RCSA، KRIs، ORAP",clue:"",
    why:"كل أداة ليها توقيت: الأحداث بعد ما تحصل، RCSA للنشاط القائم، KRIs إنذار مبكر مستمر، وORAP قبل أي جديد. مع بعض بيغطوا الخطر قبل وأثناء وبعد.",
    wrong:[{option:"BCM، BIA، KRIs، ORAP",why:"BCM وBIA خاصين بالاستمرارية."},{option:"RCSA، GRC، CAPA، KYC",why:"GRC نظام، وCAPA وKYC مش أدوات المخاطر."},{option:"الإقرار، BRCC، ORAP، RSA",why:"الإقرار والتقرير مش أدوات تقييم."}]},
   {id:"q13",section:"s2",prompt:"الإبلاغ عن الحدث التشغيلي يتم:",answer:"فور اكتشافه",clue:"",
    why:"كل دقيقة تأخير ممكن تكبّر الأثر أو تسمح بتكرار الحدث في مكان تاني، فالإدارات المختصة لازم تعرف فورًا.",
    wrong:[{option:"آخر الأسبوع",why:"التأخير بيكبّر الخسارة."},{option:"بعد تسويته",why:"التسوية مش شرط، ويتبلغ حتى لو اتسوى."},{option:"مع الإقرار الربع سنوي",why:"الإقرار تأكيد دوري ولا يغني عن الإبلاغ."}]},
   {id:"q14",section:"s2",prompt:"مسئولية الإبلاغ عن الأحداث التشغيلية تقع على:",answer:"كافة العاملين بالبنك",clue:"والإدارات تبلّغ عن طريق منسق المخاطر.",
    why:"أي موظف ممكن يكون أول واحد يشوف الحدث، فلو المسئولية على شخص واحد هتضيع أحداث كتير. الفروع والإدارات بعد كده بتبلّغ الإدارة المركزية بالتنسيق مع الـ Risk Champion.",
    wrong:[{option:"مدير الفرع فقط",why:"ممكن ما يعرفش لو الموظف ما قالش."},{option:"الإدارة المركزية لمخاطر التشغيل",why:"دي اللي بتستقبل البلاغ."},{option:"المراجعة الداخلية",why:"دي خط الدفاع التالت."}]},
   {id:"q15",section:"s2",prompt:"حساب اتفتح ببطاقة رقم قومي منتهية، وبالتحليل اتضح إن الموظفين بيعتبروا التعليمات روتين. ده مثال على:",answer:"تحليل السبب الجذري Root Cause Analysis",clue:"Why؟ أكتر من مرة.",
    why:"بسؤال 'ليه' أكتر من مرة، وصلنا من العَرَض (بطاقة منتهية) للأصل (ضعف الوعي بالمخاطر). وده اللي لازم يتعالج عشان المشكلة ما تتكررش.",
    wrong:[{option:"RCSA",why:"تقييم دوري للنشاط، مش تحليل حدث معين."},{option:"KRIs",why:"مؤشرات رقمية مستمرة."},{option:"ORAP",why:"لمنتج جديد قبل إطلاقه."}]},
   {id:"q16",section:"s2",prompt:"سجل RCSA يتم تحديثه:",answer:"كل سنتين على الأقل أو عند الحاجة",clue:"زي احتيال أو نظام جديد.",
    why:"الأنشطة بتتغير، فالسجل لازم يتراجع بشكل دوري. ولو حصل حاجة كبيرة زي احتيال أو أحداث متكررة أو نظام جديد، يتحدث قبل ميعاده.",
    wrong:[{option:"كل شهر",why:"تقييم شامل مش منطقي يتعاد كل شهر."},{option:"مرة واحدة عند إنشاء النشاط",why:"كده يبقى قديم مع أي تغيير."},{option:"كل 5 سنين",why:"مدة طويلة جدًا."}]},
   {id:"q17",section:"s2",prompt:"مقاييس تنبؤية تنبّه وحدات الأعمال لاحتمال تغيّر درجة التعرض للمخاطر:",answer:"مؤشرات الخطر الرئيسية KRIs",clue:"إنذار مبكر.",
    why:"المؤشر بيتقاس باستمرار وليه حدود إنذار، فلو قرّب منها الوحدة تتحرك قبل ما الحدث يقع. ودي طبيعة تنبؤية.",
    wrong:[{option:"إدارة الأحداث",why:"بعد ما الحدث يحصل."},{option:"ORAP",why:"دراسة منتج جديد مرة واحدة."},{option:"نظام GRC",why:"السيستم اللي بيجمع الأدوات."}]},
   {id:"q18",section:"s2",prompt:"مؤشر خطر حالته Amber يعني:",answer:"الخطر ضمن Risk Tolerance، ويستدعي زيادة المراقبة وخطط تصحيحية",clue:"أصفر.",
    why:"الأصفر إنذار مبكر: الخطر وصل لمستوى الـ Appetite لكنه لسه في حدود الـ Tolerance. مش وقت تصعيد، لكن لازم تراقب أكتر وتبدأ تصحح قبل ما يبقى أحمر.",
    wrong:[{option:"لا يتطلب أي إجراء",why:"ده الأخضر."},{option:"Breach ويستدعي التصعيد",why:"ده الأحمر."},{option:"المؤشر يتلغي",why:"المؤشر شغال وبينبهك."}]},
   {id:"q19",section:"s2",prompt:"أداة تقييم مخاطر المنتجات والخدمات الجديدة قبل بدء المشروع:",answer:"ORAP",clue:"Other Risk Approval Process.",
    why:"علاج الخطر قبل الإطلاق أرخص وأأمن من علاجه بعد ما العملاء يستخدموا المنتج، عشان كده المخاطر بتتحدد وضوابطها بتتحط قبل البدء.",
    wrong:[{option:"RCSA",why:"للأنشطة القائمة."},{option:"KRIs",why:"متابعة مستمرة."},{option:"Incident Reporting",why:"بعد وقوع الحدث."}]},
   {id:"q20",section:"s2",prompt:"الشخص المسئول عن تنفيذ الإجراء التصحيحي ويظل المسئول الأول حتى لو التنفيذ بالتنسيق مع أطراف تانية:",answer:"Action Owner",clue:"",
    why:"لو المسئولية اتقسمت على كذا حد، كل واحد هيستنى التاني. وجود مسئول واحد عن النتيجة والمتابعة بيضمن إن الإجراء يخلص في ميعاده.",
    wrong:[{option:"Risk Champion",why:"منسق المخاطر في الوحدة، مش بالضرورة صاحب الإجراء."},{option:"المراجع الداخلي",why:"بيراجع، مش بينفذ."},{option:"الإدارة المركزية",why:"بتتابع، مش بتملك الإجراء."}]},
   {id:"q21",section:"s3",prompt:"إخطار المدير المباشر بالتجاوزات في حالة عدم وجود رد خلال:",answer:"5 أيام عمل",clue:"أول درجة تصعيد.",
    why:"5 أيام عمل وقت كافي للرد على ملاحظة. لو عدت من غير رد، الموضوع بيطلع لمستوى أعلى عشان الخطر ما يفضلش معلق.",
    wrong:[{option:"يوم عمل",why:"قصير جدًا للرد على تجاوز."},{option:"10 أيام عمل",why:"دي مهلة الإقرار القديم."},{option:"30 يوم",why:"طويلة والخطر قائم."}]},
   {id:"q22",section:"s3",prompt:"مراحل التصعيد بالترتيب:",answer:"المدير المباشر ← المدير العام ← رئيس القطاع ← اللجان العليا",clue:"",
    why:"كل مستوى بيدّي فرصة للمستوى اللي تحته يحل. لو ما اتحلش، يطلع درجة. واللجان العليا آخر حاجة للتجاوزات عالية المخاطر.",
    wrong:[{option:"رئيس القطاع ← المدير المباشر ← اللجان",why:"معكوس."},{option:"اللجان ← المدير العام ← المدير المباشر",why:"معكوس."},{option:"المدير المباشر ← اللجان مباشرة",why:"بيتخطى مستويات."}]},
   {id:"q23",section:"s3",prompt:"مخاطر متبقية تصنيفها مرتفع ومحتاجين نقبلها:",answer:"تتعرض على اللجنة التنفيذية",clue:"المرتفع أعلى مستوى.",
    why:"كل ما الخطر يعلى، القرار بقبوله يحتاج سلطة أعلى، لأن أثره ممكن يكون على البنك كله. المتوسط المرتفع يقبله المدير العام، أما المرتفع فاللجنة التنفيذية.",
    wrong:[{option:"يقبلها المدير العام للإدارة",why:"ده للمتوسط المرتفع."},{option:"يقبلها مدير الفرع",why:"مش مستوى قبول مخاطر."},{option:"لا يجوز قبولها أبدًا",why:"ينفع بموافقة اللجنة التنفيذية."}]},
   {id:"q24",section:"s3",prompt:"قبول الخطر كاستراتيجية بيستند عادة على:",answer:"إن تكلفة التخفيف أعلى من الأثر المحتمل للخطر",clue:"تكلفة وفائدة.",
    why:"لو الضابط هيكلّف أكتر من الخسارة اللي ممكن تحصل، منطقيًا البنك يقبل الخطر بدل ما يصرف أكتر منه.",
    wrong:[{option:"إن الخطر مش موجود",why:"لو مش موجود مفيش حاجة تتقبل."},{option:"رغبة الموظف",why:"القرار بموافقات رسمية."},{option:"إن الخطر مرتفع جدًا",why:"المرتفع جدًا أولى إنه يتخفف."}]},
   {id:"q25",section:"s3",prompt:"أي إدارة لازم تتعرض عليها الخسائر التشغيلية في كل الحالات؟",answer:"القطاع المالي",clue:"والقانونية عند الحاجة.",
    why:"القطاع المالي هو اللي بيثبت الخسارة في حسابات البنك، فلازم يشوف كل حالة. أما الشئون القانونية فبس لما يكون فيه جانب قانوني.",
    wrong:[{option:"الشئون القانونية",why:"في الحالات اللي تتطلب بس."},{option:"الموارد البشرية",why:"مش جهة اعتماد خسائر."},{option:"المراجعة الداخلية",why:"خط تالت بيراجع، مش بيعتمد."}]},
   {id:"q26",section:"s3",prompt:"آخر مرحلة من مراحل التعاقد مع الأطراف الخارجية:",answer:"إنهاء التعاقد وخطة الخروج",clue:"5 مراحل.",
    why:"البنك لازم يكون جاهز لو الطرف الخارجي وقف أو اتغير، عشان الخدمة تتنقل من غير انقطاع. وعشان كده اتفاقية الخروج بتتحضر من مرحلة العناية الواجبة.",
    wrong:[{option:"التعاقد",why:"المرحلة التالتة."},{option:"تقييم التأهيل الأولي",why:"المرحلة الأولى."},{option:"المراقبة المستمرة",why:"المرحلة الرابعة."}]},
   {id:"q27",section:"s4",prompt:"قدرة المؤسسة على الاستمرار في تقديم خدماتها الأساسية أثناء وبعد الحوادث أو الأزمات:",answer:"إدارة استمرارية الأعمال",clue:"BCM.",
    why:"الكلمة المفتاحية 'الاستمرار في الخدمات الأساسية': BCM بتجهز الخطط والبدائل عشان البنك ما يقفش.",
    wrong:[{option:"إدارة الأزمات",why:"دي الإجراءات والقرارات وقت الحدث المفاجئ."},{option:"KRIs",why:"إنذار مبكر."},{option:"TRM",why:"مخاطر التكنولوجيا."}]},
   {id:"q28",section:"s4",prompt:"الفرق بين Incident وCrisis:",answer:"Incident حادث محدود يتحتوى بسرعة، وCrisis تأثر على الاستمرارية وتحتاج تدخل إداري موسع",clue:"الحجم.",
    why:"المعيار هو الحجم والتأثير: لو الحادث محدود والفرع يقدر يحتويه فده Incident. لو أثر على استمرارية الأعمال واحتاج تدخل إداري كبير فده Crisis.",
    wrong:[{option:"مفيش فرق",why:"الفرق في الحجم والإدارة."},{option:"Incident أكبر من Crisis",why:"العكس."},{option:"Crisis خاصة بالتكنولوجيا بس",why:"الأزمة ممكن تكون من أي مصدر."}]},
   {id:"q29",section:"s4",prompt:"وقت حدوث أزمة، أي تصرف غلط؟",answer:"اتخاذ قرارات فردية خارج الإجراءات المعتمدة",clue:"",
    why:"وقت الأزمة فيه فرق متخصصة بتنسق القرارات. القرار الفردي ممكن يتعارض مع خطتهم ويعمل خطر أكبر من الأزمة نفسها.",
    wrong:[{option:"الإبلاغ الفوري للجهة المختصة",why:"ده المطلوب."},{option:"استخدام القنوات الرسمية فقط",why:"ده المطلوب."},{option:"الالتزام بالتعليمات الصادرة",why:"ده المطلوب."}]},
   {id:"q30",section:"s4",prompt:"من البدائل التشغيلية وقت الأزمات:",answer:"العمل من المنزل، الموقع البديل، التشغيل اليدوي المؤقت، ونقل العمل لفرع تاني",clue:"",
    why:"الهدف إن الخدمات الأساسية تفضل شغالة: لو المكان مش متاح نروح لمكان تاني، ولو السيستم وقف نشتغل يدوي مؤقتًا.",
    wrong:[{option:"قفل الفرع لحد انتهاء الأزمة",why:"ده عكس الاستمرارية."},{option:"تأجيل كل المعاملات",why:"الخدمات الأساسية لازم تستمر."},{option:"تحويل العملاء لبنك تاني",why:"مش من البدائل."}]},
   {id:"q31",section:"s4",prompt:"من دورك كموظف قبل الأزمة:",answer:"تحديث بيانات الاتصال ومعرفة خطط الطوارئ الخاصة بإدارتك",clue:"",
    why:"لو بيانات الاتصال قديمة، الفريق مش هيعرف يوصلك وقت الأزمة. ولو مش عارف الخطة، هتتلخبط ساعتها.",
    wrong:[{option:"المشاركة في تقييم ما بعد الأزمة",why:"ده دورك بعد الأزمة."},{option:"سرعة الإبلاغ",why:"ده أثناء الأزمة."},{option:"دعم استعادة العمل",why:"ده بعد الأزمة."}]},
   {id:"q32",section:"s4",prompt:"عند حدوث حدث يمس الاستمرارية، الإبلاغ يكون:",answer:"بالبريد الإلكتروني للفريق المختص مع إخطار فريق BCM",clue:"BCMTeam.",
    why:"البريد الرسمي بيوثق البلاغ وتوقيته، وإخطار فريق الاستمرارية بيضمن إنهم يتحركوا بالخطط والبدائل فورًا.",
    wrong:[{option:"على جروب واتساب الفرع",why:"مش قناة رسمية."},{option:"بعد انتهاء الأزمة",why:"الإبلاغ فوري."},{option:"شفهيًا للزملاء",why:"مش موثق ومش للجهة المختصة."}]},
   {id:"q33",section:"s4",prompt:"أهم المخاطر الحالية لاستمرارية الأعمال في 2026:",answer:"تعطل الأنظمة، انقطاع الكهرباء، انقطاع الاتصالات، تعطل الموردين الخارجيين",clue:"System / Power / Telecom / Vendor.",
    why:"البنك بقى معتمد بالكامل على الأنظمة والاتصالات والموردين، فأي عطل في واحد منهم بيوقف الخدمة. ومثال سنترال رمسيس وضّح ده.",
    wrong:[{option:"مخاطر السوق والسيولة",why:"مش مخاطر استمرارية تشغيلية."},{option:"تعثر العملاء",why:"ده خطر ائتمان."},{option:"تغيّر الاستراتيجية",why:"خطر استراتيجي."}]},
   {id:"q34",section:"s4",prompt:"CAPA في إدارة مخاطر تكنولوجيا المعلومات تعني:",answer:"الإجراءات التصحيحية والوقائية",clue:"Corrective And Preventive Action.",
    why:"بعد أي عطل تقني، الإدارة بتحدد السبب الجذري، وتصلح المشكلة الحالية (تصحيحي) وتمنع تكرارها (وقائي).",
    wrong:[{option:"خطة استمرارية الأعمال",why:"دي BCP."},{option:"اختبار قبول المستخدم",why:"ده UAT."},{option:"تقييم مخاطر المشروعات الجديدة",why:"ده ORAP."}]},
   {id:"q35",section:"s4",prompt:"خطوط الدفاع الأربعة بالترتيب:",answer:"وحدات الأعمال – القطاعات الرقابية – المراجعة الداخلية – الجهات الخارجية",clue:"من الأقرب للعملية.",
    why:"الأول بيعمل الشغل ويملك الخطر، التاني بيراقبه ويحدد الصلاحيات، التالت مستقل جوه البنك بيقيّم الاتنين، والرابع من برّه البنك بيقيّم المنظومة كلها.",
    wrong:[{option:"الرقابية – وحدات الأعمال – الخارجية – المراجعة",why:"الرقابية بتراقب وحدات الأعمال فتيجي بعدها."},{option:"المراجعة – الرقابية – وحدات الأعمال – الخارجية",why:"معكوس."},{option:"الخارجية – المراجعة – الرقابية – وحدات الأعمال",why:"معكوس تمامًا."}]},
   {id:"x1",section:"s3",prompt:"عند وقوع حدث تشغيلي، أول إبلاغ يكون لـ ... لاتخاذ الإجراء الفوري تجاه الحدث:",answer:"الإدارة المعنية",
    clue:"مين يقدر يتصرف فورًا؟",
    why:"الإدارة **المعنية** هي اللي في إيدها توقف الضرر **فورًا**. إدارة مخاطر التشغيل بتسجل وتحلل وتتابع، لكن الإجراء الفوري عند صاحب الشغل.",
    wrong:[{option:"مخاطر التشغيل",why:"بتتبلغ للتسجيل والتحليل، مش للإجراء الفوري."},{option:"مدير عام النشاط",why:"مش أول محطة."},{option:"جميع ما سبق",why:"السؤال عن أول جهة للإجراء الفوري."}]},
   {id:"x2",section:"s3",prompt:"عند الإبلاغ عن الأحداث التشغيلية:",answer:"يجب استخدام النموذج المخصص للإبلاغ",
    clue:"توثيق.",
    why:"النموذج بيضمن إن **كل البيانات** المطلوبة للتحليل موجودة ومتسجلة بنفس الشكل، فيتقاس ويتقارن ويتعالج.",
    wrong:[{option:"يمكن الإبلاغ بأي وسيلة",why:"لازم النموذج."},{option:"يكفي الإبلاغ تليفونيًا",why:"التليفون مابيوثقش."},{option:"يكفي إبلاغ مدير النشاط",why:"لازم النموذج."}]},
   {id:"x3",section:"s1",prompt:"مسئولية توجيه ومراقبة المخاطر التشغيلية:",answer:"الإدارة على جميع المستويات",
    clue:"مش جهة واحدة.",
    why:"الخطر موجود في **كل** نشاط، فكل مدير في مكانه مسئول يوجّه ويراقب المخاطر في شغله، مش إدارة المخاطر لوحدها.",
    wrong:[{option:"إدارة مخاطر التشغيل",why:"دورها الإطار والأدوات، مش المسئولية لوحدها."},{option:"الإدارة العليا",why:"جزء بس."},{option:"الإدارة التنفيذية",why:"جزء بس."}]},
   {id:"x4",section:"s1",prompt:"يتم تقييم الخطر بناءً على:",answer:"معدل الأثر والتكرار",
    clue:"بعدين مع بعض.",
    why:"خطر نادر بأثر ضخم ممكن يكون أخطر من خطر متكرر بأثر بسيط، فالتقييم لازم يجمع **الأثر والتكرار**.",
    wrong:[{option:"الأثر المترتب على وقوع الخطر",why:"ناقص التكرار."},{option:"معدل تكرار وقوع الخطر",why:"ناقص الأثر."},{option:"الخبرة الشخصية",why:"مش أساس موضوعي."}]},
   {id:"x5",section:"s1",prompt:"ينعدم احتمال حدوث الخطر في حالة:",answer:"توقف النشاط تمامًا",
    clue:"الضوابط بتقلل بس.",
    why:"طول ما النشاط شغال فيه خطر متأصل. الضوابط **بتقلل** التكرار والأثر **ومابتمنعش**، فالخطر بيختفي بس لو النشاط نفسه وقف.",
    wrong:[{option:"تطبيق ضوابط رقابية فعالة",why:"بتقلل ومابتلغيش."},{option:"الالتزام بالضوابط الرقابية",why:"بيقلل بس."},{option:"الإبلاغ المبكر عن الأحداث",why:"بيقلل الأثر بس."}]}
  ]
};

/* ===== أدوات ===== */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const FILES=(typeof NOTE!=='undefined'&&NOTE.files)||{};
const srcA=(k,l)=>{const f=FILES[k];if(!f)return esc(l||k);return `<a class="src-a" href="${esc(f.u)}" target="_blank" rel="noopener">${esc(f.s||f.t)}${l?` · ${esc(l)}`:''}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>`};
const inl=s=>esc(s).replace(/\{\{([A-Za-z0-9_]+)(?:\|([^}]*))?\}\}/g,(m,k,l)=>srcA(k,l)).replace(/\*\*(.+?)\*\*/g,'<mark>$1</mark>').replace(/\[\[(.+?)\]\]/g,'<bdi class="en" dir="ltr">$1</bdi>');
const $=(s,r=document)=>r.querySelector(s);
const CAT=NOTE.categories;

const plain=s=>String(s).replace(/\*\*|\[\[|\]\]/g,'');
const lab=h=>` data-l="${esc(plain(h)).replace(/"/g,'&quot;')}"`;
function table(t){
  const n=t.headers.length;
  return `<div class="stack">${t.title?`<h3>${inl(t.title)}</h3>`:''}
  <div class="tscroll ${n>=3?'stk n'+Math.min(n,5):'w2'}"><table><thead><tr>${t.headers.map(h=>`<th scope="col">${inl(h)}</th>`).join('')}</tr></thead>
  <tbody>${t.rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' class="first"':''}${lab(t.headers[i]||'')}>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  ${t.tip?`<div class="tip"><b>انتبه:</b> ${inl(t.tip)}</div>`:''}</div>`;
}
function summary(){
  const s=NOTE.summary;
  return `<section id="summary"><h2>الخلاصة</h2><div class="stack">
   <p>${inl(s.lead)}</p>
   <div class="tscroll stk n4 sum"><table><thead><tr><th scope="col">البند</th>${s.colHeaders.map(h=>`<th scope="col">${inl(h)}</th>`).join('')}</tr></thead><tbody>
   ${s.rows.map(r=>`<tr><td class="first">${inl(r.head)}${r.sub?`<small>${inl(r.sub)}</small>`:''}</td>${r.cells.map((c,i)=>`<td class="c-${c.cat}"${lab(s.colHeaders[i]||'')}>${inl(c.main)}${c.ex?`<span class="ex">${inl(c.ex)}</span>`:''}</td>`).join('')}</tr>`).join('')}
   </tbody></table></div>
   <p class="legend">${inl(s.legend)}</p>
   <div class="golden"><b>القاعدة الذهبية:</b> ${inl(s.goldenRule)}</div></div></section>`;
}
function concepts(sec){
  return `<section id="${sec.id}"><h2>${sec.title}</h2><div class="grid">${sec.items.map(c=>`
   <article class="card">
    <span class="tag ${c.cat}">${CAT[c.cat]}</span>
    <div class="cname"><span class="en">${esc(c.nameEn)}</span><span class="ar">${esc(c.nameAr)}</span></div>
    <div class="formula">${c.formula.map(f=>`<div class="frow"><span class="dot ${f.sign==='+'?'p':f.sign==='-'?'m':'q'}">${f.sign==='+'?'✓':f.sign==='-'?'−':'?'}</span><span>${inl(f.text)}</span></div>`).join('')}</div>
    <div><h4>بنستخدمه في</h4><ul class="plain">${c.uses.map(u=>`<li>${inl(u)}</li>`).join('')}</ul></div>
    <div><h4>أمثلة</h4><div class="exs">${c.examples.map(e=>`<div class="exi"><span>${inl(e.en)}</span><span class="a2">${inl(e.ar)}</span></div>`).join('')}</div></div>
    <div><h4>دلائل</h4><div class="sig">${c.signals.map(x=>`<span class="rtl">${esc(x)}</span>`).join('')}</div></div>
    <div class="tip"><b>انتبه:</b> ${inl(c.tip)}</div>
    ${c.src?`<p class="srcl">المصدر: ${inl(c.src)}</p>`:''}
   </article>`).join('')}</div></section>`;
}
function compare(sec){
  return `<section id="${sec.id}"><h2>${sec.title}</h2><div class="stack">${sec.items.map(c=>`
   <article class="card"><div class="cmp-title">${esc(c.title)}</div>
    <div class="cmp-cols">${c.cols.map(col=>`<div class="cmp-col ${col.cat}"><h4>${esc(col.name)}</h4><p>${inl(col.when)}</p>
      <ul class="plain">${col.ex.map(e=>`<li>${inl(e)}</li>`).join('')}</ul></div>`).join('')}</div>
    <div class="golden"><b>القاعدة الذهبية:</b> ${inl(c.golden)}</div></article>`).join('')}</div></section>`;
}
function confusing(sec){
  return `<section id="${sec.id}"><h2>${sec.title}</h2><div class="stack">${sec.items.map(c=>`
   <article class="card"><h3>${inl(c.title)}</h3><p>${inl(c.explain)}</p>
    <ul class="cl">${c.examples.map(e=>{const k=e.correct===true?'ok':e.correct===false?'no':'nt';const m=k==='ok'?'✓':k==='no'?'✗':'•';
      return `<li class="${k}"><span class="m">${m}</span><span><span class="t">${inl(e.text)}</span>${e.note?`<span class="note">${inl(e.note)}</span>`:''}</span></li>`}).join('')}</ul>
   </article>`).join('')}</div></section>`;
}
function conflicts(sec){
  return `<section id="${sec.id}"><h2>${sec.title}</h2><div class="stack">${sec.items.map(c=>`<article class="card"><h3>${inl(c.title)}</h3><p>${inl(c.text)}</p></article>`).join('')}</div></section>`;
}
function reference(sec){
  return `<section id="${sec.id}"><h2>${sec.title}</h2><div class="stack">${sec.tables.map(table).join('')}</div></section>`;
}
function sources(sec){
  return `<section id="${sec.id}"><h2>${sec.title}</h2><div class="stack">${sec.intro?`<p>${inl(sec.intro)}</p>`:''}
   <ul class="srcs">${sec.items.map(it=>{const f=FILES[it.key]||{};return `<li><div class="srcs-t">${srcA(it.key)}</div>${it.pages?`<div class="srcs-p">${inl(it.pages)}</div>`:''}${f.d?`<div class="srcs-d">${inl(f.d)}</div>`:''}</li>`}).join('')}</ul></div></section>`;
}
function lookup(sec){
  return `<section id="${sec.id}"><h2>${sec.title}</h2><div class="stack">
   <input class="search" id="lq" type="search" placeholder="اكتب كلمة دالة، مثلًا: رب المال أو الفلتر أو 1975" autocomplete="off" aria-label="بحث في الدلائل">
   <div class="cnt" id="lcnt"></div>
   <div class="tscroll stk n3"><table><thead><tr><th scope="col">الدليل</th><th scope="col">المفهوم</th><th scope="col">ملاحظة</th></tr></thead><tbody id="lb"></tbody></table></div></div></section>`;
}
function fillLookup(rows){
  const lb=$('#lb'),inp=$('#lq'),cnt=$('#lcnt');
  const norm=s=>s.replace(/[ً-ْـ]/g,'').replace(/[إأآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').toLowerCase();
  const draw=()=>{
    const q=norm(inp.value.trim());
    const r=rows.filter(x=>!q||norm(x.signal+' '+x.target+' '+x.note).includes(q));
    lb.innerHTML=r.length?r.map(x=>`<tr><td class="first">${esc(x.signal)}</td><td data-l="المفهوم">${esc(x.target)}</td><td data-l="ملاحظة">${esc(x.note)}</td></tr>`).join(''):`<tr><td colspan="3" class="empty">مفيش نتيجة للكلمة دي.</td></tr>`;
    cnt.textContent=r.length+' من '+rows.length;
  };
  inp.addEventListener('input',draw);draw();
}

/* ===== الكويز ===== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const LET=['A','B','C','D'];
let QS={i:0,order:[],picks:[],opts:[]};
function quizStart(){
  QS={i:0,order:shuffle(QUIZ.questions.map((_,i)=>i)),picks:[],opts:{}};
  quizDraw();
}
function quizDraw(){
  const root=$('#quiz');
  const n=QUIZ.questions.length;
  if(QS.i>=n){return quizResult(root)}
  const qi=QS.order[QS.i],q=QUIZ.questions[qi];
  const sec=QUIZ.sections.find(s=>s.id===q.section).title;
  const opts=QS.opts[qi]||(QS.opts[qi]=shuffle([{t:q.answer,ok:true},...q.wrong.map(w=>({t:w.option,ok:false,why:w.why}))]));
  const pick=QS.picks[QS.i];
  const answered=pick!==undefined;
  const promptHtml=esc(q.prompt).replace('___',`<span class="blank${answered?(opts[pick].ok?' ok':' no'):''}">${answered?esc(q.answer):'&nbsp;&nbsp;&nbsp;&nbsp;'}</span>`);
  root.innerHTML=`
   <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${QS.i+(answered?1:0)}"><i style="width:${(QS.i+(answered?1:0))/n*100}%"></i></div>
   <div class="qmeta"><span>سؤال ${QS.i+1} من ${n}</span><span>${esc(sec)}</span></div>
   <p class="qp">${promptHtml}</p>
   <div class="opts">${opts.map((o,k)=>`<button type="button" class="opt${answered?(o.ok?' right':(k===pick?' wrongpick':'')):''}" data-k="${k}" ${answered?'disabled':''}><span class="L">${LET[k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
   ${answered?`<div class="fb" aria-live="polite">
     <div class="v ${opts[pick].ok?'ok':'no'}">${opts[pick].ok?'صح.':'مش دقيق.'}</div>
     <p><b>ليه الإجابة دي:</b> ${inl(q.why)}</p>
     ${q.clue?`<p><b>الدليل:</b> ${inl(q.clue)}</p>`:''}
     <div><b>ليه الباقي غلط:</b><ul>${opts.map((o,k)=>o.ok?'':`<li class="${k===pick?'picked':''}">${esc(o.t)}: ${inl(o.why)}${k===pick?' (اختيارك)':''}</li>`).join('')}</ul></div>
    </div>
    <button type="button" class="btn" id="qnext">${QS.i+1<n?'السؤال التالي':'شوف النتيجة'}</button>`:''}`;
  root.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{QS.picks[QS.i]=+b.dataset.k;quizDraw();const nb=$('#qnext');if(nb)nb.focus({preventScroll:true})}));
  const nb=$('#qnext');if(nb)nb.addEventListener('click',()=>{QS.i++;quizDraw();root.scrollIntoView({block:'nearest'})});
}
function quizResult(root){
  const n=QUIZ.questions.length;let total=0;const per={};
  QUIZ.sections.forEach(s=>per[s.id]={t:0,c:0});
  QS.order.forEach((qi,i)=>{const q=QUIZ.questions[qi];const ok=QS.opts[qi][QS.picks[i]].ok;per[q.section].t++;if(ok){per[q.section].c++;total++}});
  const rows=QUIZ.sections.filter(s=>per[s.id].t).map(s=>({s,p:Math.round(per[s.id].c/per[s.id].t*100)}));
  const weak=rows.slice().sort((a,b)=>a.p-b.p)[0];
  root.innerHTML=`<div class="res">
   <div class="prog"><i style="width:100%"></i></div>
   <div class="score"><bdi class="ltr" dir="ltr">${total} / ${n}</bdi></div>
   <div class="bars">${rows.map(r=>`<div class="bar${r===weak&&r.p<100?' weak':''}"><span>${esc(r.s.title)}</span><span class="pb"><i style="width:${r.p}%"></i></span><span class="ltr">${r.p}%</span></div>`).join('')}</div>
   <p>${weak.p<100?`أضعف قسم: <mark>${esc(weak.s.title)}</mark>. ارجع له في المذكرة وحاول تاني.`:'كل الأقسام 100%. ممتاز.'}</p>
   <button type="button" class="btn" id="qrestart">ابدأ من جديد</button></div>`;
  $('#qrestart').addEventListener('click',quizStart);
}

/* ===== التجميع ===== */
// كل الأقسام بتترسم بترتيبها في الملف حسب نوعها (type)، حتى لو الـid مش من الأسماء الافتراضية
const R={concepts,compare,confusing,conflicts,reference,lookup,sources};
const SHORT={concepts:'المفاهيم',compare:'الفروقات',confusing:'حالات بتلخبط',conflicts:'تعارضات',reference:'أرقام وجداول',lookup:'دوّر على دليل',sources:'المصادر'};
function chipName(sec){
  const nConcepts=NOTE.sections.filter(x=>(x.type||x.id)==='concepts').length;
  const t=(sec.type||sec.id);
  if(t==='concepts'&&nConcepts>1){const c=String(sec.title||'').replace(/^\d+[\.\-\s]*/,'').split(/[:(،]/)[0].trim();return c.length>22?c.slice(0,21)+'…':c}
  return SHORT[t]||sec.title;
}
function build(){
  const secs=NOTE.sections.filter(x=>R[x.type||x.id]);
  $('#sheet').innerHTML=`
   <header class="hero"><span class="stamp">${esc(NOTE.stamp)}</span><h1>${esc(NOTE.title)}</h1><p class="sub">${esc(NOTE.subtitle)}</p></header>
   ${summary()}${secs.map(x=>R[x.type||x.id](x)).join('')}
   <section id="quiz-sec"><h2 id="quiz-h">اختبر نفسك</h2><div class="quiz" id="quiz"></div></section>
   <p class="foot">ملخص مذاكرة لامتحان مصرفي أول G3</p>`;
  $('#chips').innerHTML=[['summary','الخلاصة'],...secs.map(x=>[x.id,chipName(x)]),['quiz-sec','اختبر نفسك']]
    .map(([id,l])=>`<a class="chip" href="#${id}" data-id="${id}">${esc(l)}</a>`).join('');
  const lk=secs.find(x=>(x.type||x.id)==='lookup');if(lk)fillLookup(lk.rows);
  quizStart();
  const links=[...document.querySelectorAll('.chip')],bar=$('#chips');
  const center=l=>{const a=l.getBoundingClientRect(),c=bar.getBoundingClientRect();bar.scrollBy({left:(a.left+a.width/2)-(c.left+c.width/2),behavior:'smooth'})};
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)links.forEach(l=>{const on=l.dataset.id===e.target.id;if(on&&!l.classList.contains('on'))center(l);l.classList.toggle('on',on)})})},{rootMargin:'-80px 0px -65% 0px'});
    links.forEach(l=>{const t=document.getElementById(l.dataset.id);if(t)io.observe(t)});
  }
}
/* المظهر: زرار واحد شمس/قمر، ومحفوظ في kk-theme المشترك مع التطبيق */
const themeBtn=$('#themeb');
function curTheme(){try{return localStorage.getItem('kk-theme')||'system'}catch(e){return 'system'}}
const isDark=()=>{const m=curTheme();return m==='dark'||(m==='system'&&matchMedia('(prefers-color-scheme: dark)').matches)};
function setTheme(m){
  const r=document.documentElement;
  if(m==='light'||m==='dark')r.setAttribute('data-theme',m);else r.removeAttribute('data-theme');
  try{localStorage.setItem('kk-theme',m)}catch(e){}
  const d=isDark();themeBtn.classList.toggle('dark',d);themeBtn.setAttribute('aria-label',d?'الوضع الداكن. دوس للفاتح':'الوضع الفاتح. دوس للداكن');
}
themeBtn.addEventListener('click',()=>setTheme(isDark()?'light':'dark'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTheme(curTheme()));
build();setTheme(curTheme());
</script>
