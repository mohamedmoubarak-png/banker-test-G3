<style>
/* Layout: ورقة كشكول واحدة في النص، هامش أحمر، شريط أقسام ثابت فوق */
:root{
  --bg:#e6ebf3; --paper:#fbfcfe; --card:#ffffff; --card-edge:#cbd6e8;
  --ink:#0c1f3f; --ink-2:#44577a; --line:#dbe3f0;
  --gold:#c9a13b; --gold-ink:#7d5f0c; --gold-wash:#faf2d8; --hl:rgba(201,161,59,.38);
  --margin:#d4584c;
  --cat-a:#a23d35; --cat-a-wash:#fbebe9;
  --cat-b:#1f4f9a; --cat-b-wash:#e6eefb;
  --cat-c:#7d5f0c; --cat-c-wash:#faf2d8;
  --ok:#1d7a4d; --no:#b3382e; --ok-wash:#e4f4ec; --no-wash:#fbebe9;
  --head-bg:#0c1f3f; --head-ink:#f3f6fc;
  --shadow:0 1px 0 rgba(12,31,63,.06),0 10px 28px rgba(12,31,63,.10);
  --f-display:'Aref Ruqaa','Amiri',serif;
  --f-body:'Tajawal','Cairo',system-ui,sans-serif;
  --f-ui:'Cairo','Tajawal',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07142b; --paper:#0c1f3f; --card:#132a52; --card-edge:#2a4577;
    --ink:#eaf0fb; --ink-2:#a9b8d3; --line:rgba(255,255,255,.07);
    --gold-ink:#e2bf62; --gold-wash:rgba(201,161,59,.14); --hl:rgba(201,161,59,.35);
    --margin:#e5675c;
    --cat-a:#f19189; --cat-a-wash:rgba(241,145,137,.13);
    --cat-b:#8fb8f4; --cat-b-wash:rgba(143,184,244,.13);
    --cat-c:#e2bf62; --cat-c-wash:rgba(201,161,59,.14);
    --ok:#6fd3a0; --no:#f19189; --ok-wash:rgba(111,211,160,.14); --no-wash:rgba(241,145,137,.14);
    --head-bg:#c9a13b; --head-ink:#0c1f3f; --shadow:0 10px 28px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07142b; --paper:#0c1f3f; --card:#132a52; --card-edge:#2a4577;
  --ink:#eaf0fb; --ink-2:#a9b8d3; --line:rgba(255,255,255,.07);
  --gold-ink:#e2bf62; --gold-wash:rgba(201,161,59,.14); --hl:rgba(201,161,59,.35);
  --margin:#e5675c;
  --cat-a:#f19189; --cat-a-wash:rgba(241,145,137,.13);
  --cat-b:#8fb8f4; --cat-b-wash:rgba(143,184,244,.13);
  --cat-c:#e2bf62; --cat-c-wash:rgba(201,161,59,.14);
  --ok:#6fd3a0; --no:#f19189; --ok-wash:rgba(111,211,160,.14); --no-wash:rgba(241,145,137,.14);
  --head-bg:#c9a13b; --head-ink:#0c1f3f; --shadow:0 10px 28px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.95;margin:0;
  padding-block:0 72px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
bdi.en,.ltr{font-family:var(--f-ui);unicode-bidi:isolate}
.ltr{direction:ltr;text-align:left}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}

/* شريط الأقسام */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;gap:10px;align-items:center;padding-block:8px;border-bottom:1px solid var(--card-edge)}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding-block:2px;
  -webkit-mask-image:linear-gradient(to left,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to left,#000 calc(100% - 24px),transparent);padding-inline-end:20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--f-ui);font-size:13.5px;font-weight:600;line-height:1.4;padding:6px 13px;border-radius:999px;border:1px solid var(--card-edge);background:var(--card);color:var(--ink-2);text-decoration:none;white-space:nowrap}
.chip:hover,.chip.on{background:var(--head-bg);border-color:var(--head-bg);color:var(--head-ink)}
.themeb{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--card-edge);background:var(--card);color:var(--gold-ink);cursor:pointer;padding:0}
.themeb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.themeb .i-moon{display:none}
.themeb.dark .i-sun{display:none}
.themeb.dark .i-moon{display:block;fill:currentColor}

/* الورقة */
.sheet{position:relative;width:100%;background-color:var(--paper);
  border-radius:6px;box-shadow:var(--shadow);padding-block:28px 40px;padding-inline-start:44px;padding-inline-end:28px;
  display:flex;flex-direction:column;gap:44px;min-width:0}
.sheet::before{content:"";position:absolute;inset-block:0;inset-inline-start:30px;width:0;border-inline-start:1.5px solid var(--margin);opacity:.55;pointer-events:none}
.sheet::after{content:"";position:absolute;inset-block:0;inset-inline-start:9px;width:10px;pointer-events:none;
  background:radial-gradient(circle at center,var(--bg) 0 3.5px,transparent 4px) center 36px/10px 96px repeat-y}
.sheet>*{min-width:0}
.sheet{overflow-wrap:anywhere}
mark{background:none;color:inherit;box-shadow:inset 0 -.5em 0 var(--hl);padding-inline:1px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,6vw,42px);line-height:1.5;margin:0;text-decoration:underline wavy var(--gold);text-decoration-thickness:2px;text-underline-offset:12px;text-wrap:balance}
section>h2{font-family:var(--f-display);font-weight:700;font-size:27px;line-height:1.6;margin:0 0 16px;display:inline-block;box-shadow:inset 0 -.32em 0 var(--hl)}
h3{font-family:var(--f-ui);font-size:17.5px;margin:0;line-height:1.6}
p{margin:0}
.lead{color:var(--ink-2)}
.hero{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.stamp{display:inline-block;transform:rotate(-2deg);font-family:var(--f-ui);font-weight:600;font-size:13px;line-height:1.5;color:var(--gold-ink);background:var(--gold-wash);border:2px solid var(--gold);border-radius:6px;padding:2px 12px}
.sub{color:var(--ink-2);font-size:17px}

/* الجداول: جدول عادي على الشاشات الواسعة، وكروت مرصوصة على الموبايل (كل خانة معاها اسم العمود) */
.tscroll{overflow-x:auto;border-radius:8px;border:1px solid var(--card-edge);background:var(--card);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15.5px;line-height:1.75;table-layout:auto}
th{background:var(--head-bg);color:var(--head-ink);font-family:var(--f-ui);font-weight:700;font-size:14px;padding:10px 14px;text-align:start;vertical-align:bottom;line-height:1.5}
td{padding:11px 14px;vertical-align:top;text-align:start;border-top:1px solid var(--card-edge);font-variant-numeric:tabular-nums}
tbody tr:nth-child(even) td:not([class]){background:color-mix(in srgb,var(--paper) 55%,transparent)}
td.first{background:var(--gold-wash);font-weight:700;min-width:7.5em}
td.first small{display:block;font-weight:400;color:var(--ink-2);font-size:13px;line-height:1.5}
td.c-a{background:var(--cat-a-wash)} td.c-b{background:var(--cat-b-wash)} td.c-c{background:var(--cat-c-wash)}
td .ex{display:block;color:var(--ink-2);font-size:13.5px;line-height:1.6;margin-top:4px}
.tscroll.w2 table td.first{width:38%}
@media (max-width:700px){
  .tscroll.stk{overflow:visible;border:0;background:none;border-radius:0}
  .tscroll.stk table,.tscroll.stk tbody,.tscroll.stk tr,.tscroll.stk td{display:block;width:100%}
  .tscroll.stk thead{display:none}
  .tscroll.stk tr{border:1px solid var(--card-edge);border-radius:10px;overflow:hidden;background:var(--card);margin-bottom:10px}
  .tscroll.stk tr:last-child{margin-bottom:0}
  .tscroll.stk td{border-top:1px solid var(--line);padding:9px 14px;background:none}
  .tscroll.stk td.first{border-top:0;background:var(--gold-wash);font-size:16.5px;min-width:0}
  .tscroll.stk td.c-a{background:var(--cat-a-wash)} .tscroll.stk td.c-b{background:var(--cat-b-wash)} .tscroll.stk td.c-c{background:var(--cat-c-wash)}
  .tscroll.stk td[data-l]:not(.first)::before{content:attr(data-l);display:block;font-family:var(--f-ui);font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1.5;margin-bottom:1px}
  .tscroll.stk td.empty::before{display:none}
}
.legend{font-size:14px;color:var(--ink-2);margin-top:12px}
.legend .k{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-inline:4px 4px}

/* مربعات */
.golden,.tip,.formula{border:2px dashed var(--gold);background:var(--gold-wash);border-radius:8px;padding:10px 16px;line-height:1.9}
.golden b{color:var(--gold-ink)}
.tip{border-color:var(--margin);background:var(--card)}
.tip b{color:var(--margin)}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.card{background:var(--card);border:1px solid var(--card-edge);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tag{align-self:flex-start;font-family:var(--f-ui);font-size:12px;font-weight:700;line-height:1.5;padding:1px 10px;border-radius:999px}
.tag.a{background:var(--cat-a-wash);color:var(--cat-a)} .tag.b{background:var(--cat-b-wash);color:var(--cat-b)} .tag.c{background:var(--cat-c-wash);color:var(--cat-c)}
.cname{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.cname .en{font-family:var(--f-ui);font-weight:700;font-size:18px;direction:ltr}
.cname .ar{font-size:16px;color:var(--ink-2)}
.formula{display:flex;flex-direction:column;gap:6px;padding:10px 12px}
.frow{display:flex;gap:10px;align-items:flex-start;line-height:1.7}
.dot{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-ui);font-size:13px;font-weight:700;color:var(--paper);margin-top:2px}
.dot.p{background:var(--ok)} .dot.m{background:var(--no)} .dot.q{background:var(--cat-b)}
h4{font-family:var(--f-ui);font-size:14px;margin:0;color:var(--ink-2);line-height:1.6}
ul.plain{margin:0;padding-inline-start:20px;display:flex;flex-direction:column}
.exs{display:flex;flex-direction:column;gap:6px}
.exi{display:flex;flex-direction:column;border-inline-start:3px solid var(--card-edge);padding-inline-start:12px;line-height:1.7}
.exi .a2{color:var(--ink-2);font-size:14px}
.sig{display:flex;flex-wrap:wrap;gap:6px}
.sig span{direction:ltr;font-family:var(--f-ui);font-size:13px;line-height:1.5;padding:2px 10px;border-radius:999px;background:var(--gold-wash);color:var(--gold-ink);border:1px solid var(--gold)}
.sig span.rtl{direction:rtl;font-family:var(--f-body)}
.cmp-cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.cmp-col{border-radius:6px;border:1px solid var(--card-edge);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cmp-col.a{background:var(--cat-a-wash)} .cmp-col.b{background:var(--cat-b-wash)} .cmp-col.c{background:var(--cat-c-wash)}
.cmp-col h4{color:var(--ink);font-size:15px}
.cmp-title{direction:ltr;text-align:left;font-family:var(--f-ui);font-weight:700;font-size:18px}
.cl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cl li{display:flex;gap:10px;align-items:flex-start;line-height:1.7}
.cl .m{flex:none;width:22px;text-align:center;font-family:var(--f-ui);font-weight:700}
.cl .ok .m{color:var(--ok)} .cl .no .m{color:var(--no)} .cl .nt .m{color:var(--cat-c)}
.cl .no .t{text-decoration:line-through;text-decoration-color:var(--no)}
.cl .note{display:block;font-size:13px;color:var(--ink-2);line-height:1.6}

/* بحث */
.search{width:100%;font:inherit;font-family:var(--f-ui);font-size:16px;line-height:1.5;padding:10px 14px;border-radius:8px;border:1px solid var(--card-edge);background:var(--card);color:var(--ink)}
.search::placeholder{color:var(--ink-2)}
.cnt{font-size:13px;color:var(--ink-2);font-family:var(--f-ui)}
.empty{padding:16px;color:var(--ink-2)}

/* كويز */
.quiz{background:var(--card);border:1px solid var(--card-edge);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:16px}
.prog{height:8px;border-radius:999px;background:var(--line);overflow:hidden;border:1px solid var(--card-edge)}
.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.qmeta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--f-ui);font-size:13px;color:var(--ink-2)}
.qp{font-size:18px;line-height:1.9;font-weight:500}
.qp .blank{display:inline-block;min-width:80px;border-bottom:2px dashed var(--gold);text-align:center;padding-inline:6px}
.qp .blank.ok{border-bottom:2px solid var(--ok);color:var(--ok);font-weight:700}
.qp .blank.no{border-bottom:2px solid var(--no);color:var(--no);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:start;width:100%;font:inherit;line-height:1.7;padding:10px 14px;border-radius:8px;border:1px solid var(--card-edge);background:var(--paper);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--gold);background:var(--gold-wash)}
.opt .L{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-ui);font-weight:700;font-size:13px;line-height:1;background:var(--line);color:var(--ink);margin-top:2px}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-wash);border-color:var(--ok)}
.opt.wrongpick{background:var(--no-wash);border-color:var(--no)}
.fb{display:flex;flex-direction:column;gap:10px;border-radius:8px;padding:12px 16px;background:var(--gold-wash);border:1px dashed var(--gold)}
.fb .v{font-weight:700;font-family:var(--f-ui)}
.fb .v.ok{color:var(--ok)} .fb .v.no{color:var(--no)}
.fb ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.fb li.picked{font-weight:700}
.btn{align-self:flex-start;font-family:var(--f-ui);font-weight:600;font-size:15px;line-height:1.4;padding:10px 20px;border-radius:8px;border:0;background:var(--head-bg);color:var(--head-ink);cursor:pointer}
.res{display:flex;flex-direction:column;gap:12px}
.score{font-family:var(--f-display);font-size:40px;line-height:1.4}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,140px) 1fr 44px;gap:10px;align-items:center;font-size:14px;line-height:1.5}
.bar .pb{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar .pb i{display:block;height:100%;background:var(--cat-b)}
.bar.weak .pb i{background:var(--no)}
.srcl{font-family:var(--f-ui);font-size:12px;line-height:1.6;color:var(--ink-2);margin:0}
.foot{font-size:14px;color:var(--ink-2)}
@media (max-width:600px){
  body{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .sheet{padding-block:22px 32px;padding-inline-start:26px;padding-inline-end:14px;gap:38px}
  .sheet::before{inset-inline-start:16px}
  .sheet::after{display:none}
  .card{padding:14px}
  section>h2{font-size:25px}
  .bar{grid-template-columns:84px 1fr 40px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.prog i{transition:none}}
</style>

  </nav>

/* ===== أدوات ===== */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<mark>$1</mark>').replace(/\[\[(.+?)\]\]/g,'<bdi class="en" dir="ltr">$1</bdi>');
const $=(s,r=document)=>r.querySelector(s);
const CAT=NOTE.categories;

const plain=s=>String(s).replace(/\*\*|\[\[|\]\]/g,'');
const lab=h=>` data-l="${esc(plain(h)).replace(/"/g,'&quot;')}"`;
function table(t){
  const n=t.headers.length;
  return `<div class="stack">${t.title?`<h3>${inl(t.title)}</h3>`:''}
  <div class="tscroll ${n>=3?'stk':'w2'}"><table><thead><tr>${t.headers.map(h=>`<th scope="col">${inl(h)}</th>`).join('')}</tr></thead>
  <tbody>${t.rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' class="first"':''}${lab(t.headers[i]||'')}>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  ${t.tip?`<div class="tip"><b>انتبه:</b> ${inl(t.tip)}</div>`:''}</div>`;
}
function summary(){
  const s=NOTE.summary;
  return `<section id="summary"><h2>الخلاصة</h2><div class="stack">
   <p>${inl(s.lead)}</p>
   <div class="tscroll stk"><table><thead><tr><th scope="col">البند</th>${s.colHeaders.map(h=>`<th scope="col">${inl(h)}</th>`).join('')}</tr></thead><tbody>
   ${s.rows.map(r=>`<tr><td class="first">${inl(r.head)}${r.sub?`<small>${inl(r.sub)}</small>`:''}</td>${r.cells.map((c,i)=>`<td class="c-${c.cat}"${lab(s.colHeaders[i]||'')}>${inl(c.main)}${c.ex?`<span class="ex">${inl(c.ex)}</span>`:''}</td>`).join('')}</tr>`).join('')}
   </tbody></table></div>
   <p class="legend">${inl(s.legend)}</p>
   <div class="golden"><b>القاعدة الذهبية:</b> ${inl(s.goldenRule)}</div></div></section>`;
}
function concepts(sec){
  return `<section id="${sec.id}"><h2>${sec.title}</h2><div class="grid">${sec.items.map(c=>`
   <article class="card">
    <span class="tag ${c.cat}">${CAT[c.cat]}</span>
    <div class="cname"><span class="en">${esc(c.nameEn)}</span><span class="ar">${esc(c.nameAr)}</span></div>
    <div class="formula">${c.formula.map(f=>`<div class="frow"><span class="dot ${f.sign==='+'?'p':f.sign==='-'?'m':'q'}">${f.sign==='+'?'✓':f.sign==='-'?'−':'?'}</span><span>${inl(f.text)}</span></div>`).join('')}</div>
    <div><h4>بنستخدمه في</h4><ul class="plain">${c.uses.map(u=>`<li>${inl(u)}</li>`).join('')}</ul></div>
    <div><h4>أمثلة</h4><div class="exs">${c.examples.map(e=>`<div class="exi"><span>${inl(e.en)}</span><span class="a2">${inl(e.ar)}</span></div>`).join('')}</div></div>
    <div><h4>دلائل</h4><div class="sig">${c.signals.map(x=>`<span class="rtl">${esc(x)}</span>`).join('')}</div></div>
    <div class="tip"><b>انتبه:</b> ${inl(c.tip)}</div>
    ${c.src?`<p class="srcl">المصدر: ${esc(c.src)}</p>`:''}
   </article>`).join('')}</div></section>`;
}
function compare(sec){
  return `<section id="${sec.id}"><h2>${sec.title}</h2><div class="stack">${sec.items.map(c=>`
   <article class="card"><div class="cmp-title">${esc(c.title)}</div>
    <div class="cmp-cols">${c.cols.map(col=>`<div class="cmp-col ${col.cat}"><h4>${esc(col.name)}</h4><p>${inl(col.when)}</p>
      <ul class="plain">${col.ex.map(e=>`<li>${inl(e)}</li>`).join('')}</ul></div>`).join('')}</div>
    <div class="golden"><b>القاعدة الذهبية:</b> ${inl(c.golden)}</div></article>`).join('')}</div></section>`;
}
function confusing(sec){
  return `<section id="${sec.id}"><h2>${sec.title}</h2><div class="stack">${sec.items.map(c=>`
   <article class="card"><h3>${inl(c.title)}</h3><p>${inl(c.explain)}</p>
    <ul class="cl">${c.examples.map(e=>{const k=e.correct===true?'ok':e.correct===false?'no':'nt';const m=k==='ok'?'✓':k==='no'?'✗':'•';
      return `<li class="${k}"><span class="m">${m}</span><span><span class="t">${inl(e.text)}</span>${e.note?`<span class="note">${inl(e.note)}</span>`:''}</span></li>`}).join('')}</ul>
   </article>`).join('')}</div></section>`;
}
function conflicts(sec){
  return `<section id="${sec.id}"><h2>${sec.title}</h2><div class="stack">${sec.items.map(c=>`<article class="card"><h3>${inl(c.title)}</h3><p>${inl(c.text)}</p></article>`).join('')}</div></section>`;
}
function reference(sec){
  return `<section id="${sec.id}"><h2>${sec.title}</h2><div class="stack">${sec.tables.map(table).join('')}</div></section>`;
}
function lookup(sec){
  return `<section id="${sec.id}"><h2>${sec.title}</h2><div class="stack">
   <input class="search" id="lq" type="search" placeholder="اكتب كلمة دالة، مثلًا: رب المال أو الفلتر أو 1975" autocomplete="off" aria-label="بحث في الدلائل">
   <div class="cnt" id="lcnt"></div>
   <div class="tscroll stk"><table><thead><tr><th scope="col">الدليل</th><th scope="col">المفهوم</th><th scope="col">ملاحظة</th></tr></thead><tbody id="lb"></tbody></table></div></div></section>`;
}
function fillLookup(rows){
  const lb=$('#lb'),inp=$('#lq'),cnt=$('#lcnt');
  const norm=s=>s.replace(/[ً-ْـ]/g,'').replace(/[إأآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').toLowerCase();
  const draw=()=>{
    const q=norm(inp.value.trim());
    const r=rows.filter(x=>!q||norm(x.signal+' '+x.target+' '+x.note).includes(q));
    lb.innerHTML=r.length?r.map(x=>`<tr><td class="first">${esc(x.signal)}</td><td data-l="المفهوم">${esc(x.target)}</td><td data-l="ملاحظة">${esc(x.note)}</td></tr>`).join(''):`<tr><td colspan="3" class="empty">مفيش نتيجة للكلمة دي.</td></tr>`;
    cnt.textContent=r.length+' من '+rows.length;
  };
  inp.addEventListener('input',draw);draw();
}

/* ===== الكويز ===== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const LET=['A','B','C','D'];
let QS={i:0,order:[],picks:[],opts:[]};
function quizStart(){
  QS={i:0,order:shuffle(QUIZ.questions.map((_,i)=>i)),picks:[],opts:{}};
  quizDraw();
}
function quizDraw(){
  const root=$('#quiz');
  const n=QUIZ.questions.length;
  if(QS.i>=n){return quizResult(root)}
  const qi=QS.order[QS.i],q=QUIZ.questions[qi];
  const sec=QUIZ.sections.find(s=>s.id===q.section).title;
  const opts=QS.opts[qi]||(QS.opts[qi]=shuffle([{t:q.answer,ok:true},...q.wrong.map(w=>({t:w.option,ok:false,why:w.why}))]));
  const pick=QS.picks[QS.i];
  const answered=pick!==undefined;
  const promptHtml=esc(q.prompt).replace('___',`<span class="blank${answered?(opts[pick].ok?' ok':' no'):''}">${answered?esc(q.answer):'&nbsp;&nbsp;&nbsp;&nbsp;'}</span>`);
  root.innerHTML=`
   <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${QS.i+(answered?1:0)}"><i style="width:${(QS.i+(answered?1:0))/n*100}%"></i></div>
   <div class="qmeta"><span>سؤال ${QS.i+1} من ${n}</span><span>${esc(sec)}</span></div>
   <p class="qp">${promptHtml}</p>
   <div class="opts">${opts.map((o,k)=>`<button type="button" class="opt${answered?(o.ok?' right':(k===pick?' wrongpick':'')):''}" data-k="${k}" ${answered?'disabled':''}><span class="L">${LET[k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
   ${answered?`<div class="fb" aria-live="polite">
     <div class="v ${opts[pick].ok?'ok':'no'}">${opts[pick].ok?'صح.':'مش دقيق.'}</div>
     <p><b>ليه الإجابة دي:</b> ${inl(q.why)}</p>
     ${q.clue?`<p><b>الدليل:</b> ${inl(q.clue)}</p>`:''}
     <div><b>ليه الباقي غلط:</b><ul>${opts.map((o,k)=>o.ok?'':`<li class="${k===pick?'picked':''}">${esc(o.t)}: ${inl(o.why)}${k===pick?' (اختيارك)':''}</li>`).join('')}</ul></div>
    </div>
    <button type="button" class="btn" id="qnext">${QS.i+1<n?'السؤال التالي':'شوف النتيجة'}</button>`:''}`;
  root.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{QS.picks[QS.i]=+b.dataset.k;quizDraw();const nb=$('#qnext');if(nb)nb.focus({preventScroll:true})}));
  const nb=$('#qnext');if(nb)nb.addEventListener('click',()=>{QS.i++;quizDraw();root.scrollIntoView({block:'nearest'})});
}
function quizResult(root){
  const n=QUIZ.questions.length;let total=0;const per={};
  QUIZ.sections.forEach(s=>per[s.id]={t:0,c:0});
  QS.order.forEach((qi,i)=>{const q=QUIZ.questions[qi];const ok=QS.opts[qi][QS.picks[i]].ok;per[q.section].t++;if(ok){per[q.section].c++;total++}});
  const rows=QUIZ.sections.filter(s=>per[s.id].t).map(s=>({s,p:Math.round(per[s.id].c/per[s.id].t*100)}));
  const weak=rows.slice().sort((a,b)=>a.p-b.p)[0];
  root.innerHTML=`<div class="res">
   <div class="prog"><i style="width:100%"></i></div>
   <div class="score"><bdi class="ltr" dir="ltr">${total} / ${n}</bdi></div>
   <div class="bars">${rows.map(r=>`<div class="bar${r===weak&&r.p<100?' weak':''}"><span>${esc(r.s.title)}</span><span class="pb"><i style="width:${r.p}%"></i></span><span class="ltr">${r.p}%</span></div>`).join('')}</div>
   <p>${weak.p<100?`أضعف قسم: <mark>${esc(weak.s.title)}</mark>. ارجع له في المذكرة وحاول تاني.`:'كل الأقسام 100%. ممتاز.'}</p>
   <button type="button" class="btn" id="qrestart">ابدأ من جديد</button></div>`;
  $('#qrestart').addEventListener('click',quizStart);
}

// كل الأقسام بتترسم بترتيبها في الملف حسب نوعها (type)، حتى لو الـid مش من الأسماء الافتراضية
const R={concepts,compare,confusing,conflicts,reference,lookup};
const SHORT={concepts:'المفاهيم',compare:'الفروقات',confusing:'حالات بتلخبط',conflicts:'تعارضات',reference:'أرقام وجداول',lookup:'دوّر على دليل'};
function chipName(sec){
  const nConcepts=NOTE.sections.filter(x=>(x.type||x.id)==='concepts').length;
  const t=(sec.type||sec.id);
  if(t==='concepts'&&nConcepts>1){const c=String(sec.title||'').replace(/^\d+[\.\-\s]*/,'').split(/[:(،]/)[0].trim();return c.length>22?c.slice(0,21)+'…':c}
  return SHORT[t]||sec.title;
}
function build(){
  const secs=NOTE.sections.filter(x=>R[x.type||x.id]);
  $('#sheet').innerHTML=`
   <header class="hero"><span class="stamp">${esc(NOTE.stamp)}</span><h1>${esc(NOTE.title)}</h1><p class="sub">${esc(NOTE.subtitle)}</p></header>
   ${summary()}${secs.map(x=>R[x.type||x.id](x)).join('')}
   <section id="quiz-sec"><h2 id="quiz-h">اختبر نفسك</h2><div class="quiz" id="quiz"></div></section>
   <p class="foot">ملخص مذاكرة لامتحان مصرفي أول G3</p>`;
  $('#chips').innerHTML=[['summary','الخلاصة'],...secs.map(x=>[x.id,chipName(x)]),['quiz-sec','اختبر نفسك']]
    .map(([id,l])=>`<a class="chip" href="#${id}" data-id="${id}">${esc(l)}</a>`).join('');
  const lk=secs.find(x=>(x.type||x.id)==='lookup');if(lk)fillLookup(lk.rows);
  quizStart();
  const links=[...document.querySelectorAll('.chip')],bar=$('#chips');
  const center=l=>{const a=l.getBoundingClientRect(),c=bar.getBoundingClientRect();bar.scrollBy({left:(a.left+a.width/2)-(c.left+c.width/2),behavior:'smooth'})};
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)links.forEach(l=>{const on=l.dataset.id===e.target.id;if(on&&!l.classList.contains('on'))center(l);l.classList.toggle('on',on)})})},{rootMargin:'-80px 0px -65% 0px'});
    links.forEach(l=>{const t=document.getElementById(l.dataset.id);if(t)io.observe(t)});
  }
}
/* المظهر: زرار واحد شمس/قمر، ومحفوظ في kk-theme المشترك مع التطبيق */
const themeBtn=$('#themeb');
function curTheme(){try{return localStorage.getItem('kk-theme')||'system'}catch(e){return 'system'}}
const isDark=()=>{const m=curTheme();return m==='dark'||(m==='system'&&matchMedia('(prefers-color-scheme: dark)').matches)};
function setTheme(m){
  const r=document.documentElement;
  if(m==='light'||m==='dark')r.setAttribute('data-theme',m);else r.removeAttribute('data-theme');
  try{localStorage.setItem('kk-theme',m)}catch(e){}
  const d=isDark();themeBtn.classList.toggle('dark',d);themeBtn.setAttribute('aria-label',d?'الوضع الداكن. دوس للفاتح':'الوضع الفاتح. دوس للداكن');
}
themeBtn.addEventListener('click',()=>setTheme(isDark()?'light':'dark'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTheme(curTheme()));
build();setTheme(curTheme());
</script>
